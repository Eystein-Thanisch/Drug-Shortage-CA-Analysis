{% extends "layout.html" %}

{% block content %}

<form action="/quote" method="post">
    <div class="form-group">
        <div class="row">
            <div class="col-md-4">
                <div class="dropdown">
                    <button class="dropbtn">Subject</button>
                    <div class="dropdown-content">
                        <a href="#">Drug</a>
                        <a href="#">Manufacturer</a>
                        <a href="#">Active Ingredient</a>
                    </div>
                </div>
            </div>
            <!-- Source: https://select2.org/getting-started/basic-usage -->
            <div class="col-md-4">
                <select id="s2_1" class="js-example-basic-single" name="name">
                    <option></option>
                    {% for item in lists %}
                        <option value="{{ item["code"] }}">{{ item["name"] }}</option>
                    {% endfor %}
                </select>
                <p>or</p>
                <select id="s2_2" class="js-example-basic-single" name="id">
                    <option></option>
                    {% for item in lists %}
                        <option value="{{ item["code"] }}">{{ item["code"] }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="col-md-4">
                <input class="btn btn-primary" type="submit">
            </div>
        </div>
    </div>
</form>

{% endblock %}
