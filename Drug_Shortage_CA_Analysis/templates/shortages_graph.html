<html>
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.16.1/vis.css" type="text/css" />
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.16.1/vis-network.min.js"> </script>
<center>
<h1></h1>
</center>

<!-- <link rel="stylesheet" href="../node_modules/vis/dist/vis.min.css" type="text/css" />
<script type="text/javascript" src="../node_modules/vis/dist/vis.js"> </script>-->

<style type="text/css">

        #mynetwork {
            width: 100%;
            height: 800px;
            background-color: #ffffff;
            border: 1px solid lightgray;
            position: relative;
            float: left;
        }

        

        
        #config {
            float: left;
            width: 400px;
            height: 600px;
        }
        

        
</style>

</head>

<body>
<div id = "mynetwork"></div>


<div id = "config"></div>

<script type="text/javascript">

    // initialize global variables.
    var edges;
    var nodes;
    var network; 
    var container;
    var options, data;

    
    // This method is responsible for drawing the graph, returns the drawn network
    function drawGraph() {
        var container = document.getElementById('mynetwork');
        
        

        // parsing and collecting nodes and edges from the python
        nodes = new vis.DataSet([{"color": "#d0d624", "id": "HONEY", "label": "HONEY", "mass": 100, "shape": "triangle", "size": 100}, {"color": "#89d624", "id": 17811, "label": "HERBAL COUGH EXPECTORANT", "shape": "diamond", "title": "02125811"}, {"color": "#5380cf", "id": 4403, "label": "JAMIESON LABORATORIES LTD", "shape": "square"}, {"color": "#d0d624", "id": "OIL OF ANISE", "label": "OIL OF ANISE", "shape": "triangle"}, {"color": "#d0d624", "id": "WHITE PINE", "label": "WHITE PINE", "shape": "triangle"}, {"color": "#d0d624", "id": "ELM BARK", "label": "ELM BARK", "shape": "triangle"}, {"color": "#d0d624", "id": "EUCALYPTUS OIL", "label": "EUCALYPTUS OIL", "shape": "triangle"}, {"color": "#d0d624", "id": "OIL OF CAMPHOR", "label": "OIL OF CAMPHOR", "shape": "triangle"}, {"color": "#89d624", "id": 41421, "label": "MIELOCOL SYRUP", "shape": "diamond", "title": "00417149"}, {"color": "#5380cf", "id": 5325, "label": "HERBES UNIVERSELLES INC.", "shape": "square"}, {"color": "#d0d624", "id": "WILD CHERRY", "label": "WILD CHERRY", "shape": "triangle"}, {"color": "#d0d624", "id": "ARALIA RACEMOSA", "label": "ARALIA RACEMOSA", "shape": "triangle"}, {"color": "#d0d624", "id": "POPLAR BUD", "label": "POPLAR BUD", "shape": "triangle"}, {"color": "#d0d624", "id": "SANGUINARIA CANADENSIS", "label": "SANGUINARIA CANADENSIS", "shape": "triangle"}, {"color": "#d0d624", "id": "GUAIFENESIN", "label": "GUAIFENESIN", "shape": "triangle"}, {"color": "#d0d624", "id": "EUCALYPTOL", "label": "EUCALYPTOL", "shape": "triangle"}]);
        edges = new vis.DataSet([{"from": 17811, "to": "HONEY"}, {"from": 4403, "to": 17811}, {"from": 17811, "to": "OIL OF ANISE"}, {"from": 17811, "to": "WHITE PINE"}, {"from": 17811, "to": "ELM BARK"}, {"from": 17811, "to": "EUCALYPTUS OIL"}, {"from": 17811, "to": "OIL OF CAMPHOR"}, {"from": 41421, "to": "HONEY"}, {"from": 5325, "to": 41421}, {"from": 41421, "to": "WHITE PINE"}, {"from": 41421, "to": "WILD CHERRY"}, {"from": 41421, "to": "ARALIA RACEMOSA"}, {"from": 41421, "to": "POPLAR BUD"}, {"from": 41421, "to": "SANGUINARIA CANADENSIS"}, {"from": 41421, "to": "GUAIFENESIN"}, {"from": 41421, "to": "EUCALYPTOL"}]);

        // adding nodes and edges to the graph
        data = {nodes: nodes, edges: edges};

        var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": true,
            "type": "dynamic"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};
        
        

        
        // if this network requires displaying the configure window,
        // put it in its div
        options.configure["container"] = document.getElementById("config");
        

        network = new vis.Network(container, data, options);
	 
        


        

        return network;

    }

    drawGraph();

</script>
</body>
</html>
