<html>
<head>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/vis/4.16.1/vis.css" type="text/css" />
<script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/vis/4.16.1/vis-network.min.js"> </script>
<center>
<h1></h1>
</center>

<!-- <link rel="stylesheet" href="../node_modules/vis/dist/vis.min.css" type="text/css" />
<script type="text/javascript" src="../node_modules/vis/dist/vis.js"> </script>-->

<style type="text/css">

        #mynetwork {
            width: 1000px;
            height: 1000px;
            background-color: #ffffff;
            border: 1px solid lightgray;
            position: relative;
            float: left;
        }

        

        
        #config {
            float: left;
            width: 400px;
            height: 600px;
        }
        

        
</style>

</head>

<body>
<div id = "mynetwork"></div>


<div id = "config"></div>

<script type="text/javascript">

    // initialize global variables.
    var edges;
    var nodes;
    var network; 
    var container;
    var options, data;

    
    // This method is responsible for drawing the graph, returns the drawn network
    function drawGraph() {
        var container = document.getElementById('mynetwork');
        
        

        // parsing and collecting nodes and edges from the python
        nodes = new vis.DataSet([{"color": "#89d624", "id": 92969, "label": "STRENSIQ", "shape": "diamond"}, {"color": "#5380cf", "id": 15662, "label": "ALEXION PHARMA GMBH", "shape": "square"}, {"color": "#d0d624", "id": "ASFOTASE ALFA", "label": "ASFOTASE ALFA", "shape": "triangle"}, {"color": "#89d624", "id": 92968, "label": "STRENSIQ", "shape": "diamond"}, {"color": "#e30e38", "id": 92970, "label": "STRENSIQ", "shape": "diamond"}, {"color": "#e30e38", "id": 92971, "label": "STRENSIQ", "shape": "diamond"}, {"color": "#89d624", "id": 92972, "label": "STRENSIQ", "shape": "diamond"}]);
        edges = new vis.DataSet([{"from": 15662, "to": 92969}, {"from": 92969, "to": "ASFOTASE ALFA"}, {"from": 92968, "to": "ASFOTASE ALFA"}, {"from": 15662, "to": 92968}, {"from": 92970, "to": "ASFOTASE ALFA"}, {"from": 15662, "to": 92970}, {"from": 92971, "to": "ASFOTASE ALFA"}, {"from": 15662, "to": 92971}, {"from": 92972, "to": "ASFOTASE ALFA"}, {"from": 15662, "to": 92972}]);

        // adding nodes and edges to the graph
        data = {nodes: nodes, edges: edges};

        var options = {
    "configure": {
        "enabled": true,
        "filter": [
            "physics"
        ]
    },
    "edges": {
        "color": {
            "inherit": true
        },
        "smooth": {
            "enabled": false,
            "type": "continuous"
        }
    },
    "interaction": {
        "dragNodes": true,
        "hideEdgesOnDrag": false,
        "hideNodesOnDrag": false
    },
    "physics": {
        "enabled": true,
        "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
        }
    }
};
        
        

        
        // if this network requires displaying the configure window,
        // put it in its div
        options.configure["container"] = document.getElementById("config");
        

        network = new vis.Network(container, data, options);
	 
        


        

        return network;

    }

    drawGraph();

</script>
</body>
</html>
